<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ejobz Admin</title>
<link rel="icon" type="image/png" sizes="16x16" href="j.png?v=2"">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">
        <img src="j.png" alt="Logo" class="logo-img">
      </a>
    </div>
    <div class="nav-right">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search roles, companies, keywords...">
      </div>
      <a href="home.html" class="btn btn-secondary" title="View Candidate Hub">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span class="btn-label-text">Jobs</span>
      </a>
      <button class="btn btn-primary" onclick="openAddModal()" title="Post New Job">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <div>
        <h2>Manage Job Openings</h2>
        <p class="text-subtitle">Post, edit, & maintain active opportunities on the network.</p>
      </div>
    </div>
    <div id="jobsGrid" class="jobs-grid"></div>
  </main>

  <div id="jobModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 id="modalTitle">Post New Job</h3>
          <p class="text-subtitle">Fill in the details to publish a new listing.</p>
        </div>
        <button type="button" class="close-modal" aria-label="Close modal" onclick="closeModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="jobForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="role">Role Title</label>
            <input type="text" id="role" required placeholder="e.g. Senior Frontend Engineer">
          </div>
          <div class="form-group">
            <label for="company">Company Name</label>
            <input type="text" id="company" required placeholder="e.g. Acme Corp">
          </div>
          <div class="form-group">
            <label for="sector">Sector / Industry</label>
            <input type="text" id="sector" required placeholder="e.g. Fintech, SaaS">
          </div>
          <div class="form-group">
            <label for="experience">Experience Required</label>
            <input type="text" id="experience" required placeholder="e.g. 2-4 yrs">
          </div>
          <div class="form-group full-width">
            <label for="pay">Salary / CTC</label>
            <input type="text" id="pay" required placeholder="e.g. ₹15-22 LPA">
          </div>
          <div class="form-group full-width">
            <label for="description">Job Description</label>
            <textarea id="description" required placeholder="Detail key responsibilities, requirements, and benefits..."></textarea>
          </div>
          <div class="form-group full-width">
            <label for="link">Application URL</label>
            <input type="url" id="link" required placeholder="https://careers.company.com/job/123">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save & Publish</button>
        </div>
      </form>
    </div>
  </div>

  <div id="detailModal" class="modal-backdrop">
    <div class="modal-card modal-lg">
      <div class="modal-header">
        <div class="company-brand-header">
          <div id="detailAvatar" class="company-avatar-lg"></div>
          <div>
            <h3 id="detailRole">Job Title</h3>
            <p id="detailCompany" class="job-company-sub"></p>
          </div>
        </div>
        <button type="button" class="close-modal" aria-label="Close modal" onclick="closeDetailModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="detailMetrics" class="detail-metrics-grid"></div>
        <div class="detail-section">
          <h4>About the Role</h4>
          <div id="detailDescription" class="detail-description-body"></div>
        </div>
      </div>
      <div class="modal-footer" id="detailFooter"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
