<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KA₹MA JobHub - Explore Jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="home.html" class="logo">
        <div class="logo-icon">₹</div>
        <span>KA<span class="logo-accent">₹</span>MA</span>
      </a>
    </div>
    <div class="nav-right">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search role, company, skills...">
      </div>
      <button class="btn btn-secondary icon-btn-text" onclick="openFilterModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span id="activeFilterBadge" class="filter-badge-dot hidden"></span>
      </button>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <div>
        <h2>Explore Opportunities</h2>
        <p class="text-subtitle">Discover top technology, design, & growth roles across leading startups.</p>
      </div>
    </div>
    <div id="jobsGrid" class="jobs-grid"></div>
  </main>

  <div id="filterModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3>Filter & Sort Jobs</h3>
          <p class="text-subtitle">Narrow down roles to fit your profile.</p>
        </div>
        <button type="button" class="close-modal" aria-label="Close modal" onclick="closeFilterModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="filterSector">Industry / Sector</label>
          <input type="text" id="filterSector" placeholder="e.g. Technology, Fintech, SaaS">
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="filterMinPay">Min Pay (₹ LPA)</label>
            <input type="number" id="filterMinPay" placeholder="e.g. 12" min="0" step="0.5">
          </div>
          <div class="form-group">
            <label for="filterMaxExp">Max Experience (Years)</label>
            <input type="number" id="filterMaxExp" placeholder="e.g. 4" min="0">
          </div>
        </div>
        <div class="form-group">
          <label for="sortBy">Sort Listings By</label>
          <select id="sortBy">
            <option value="">Default Order</option>
            <option value="date-desc">Date: Newest First</option>
            <option value="date-asc">Date: Oldest First</option>
            <option value="pay-high">Pay: High to Low</option>
            <option value="pay-low">Pay: Low to High</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="resetFilters()">Reset All</button>
        <button type="button" class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
      </div>
    </div>
  </div>

  <div id="detailModal" class="modal-backdrop">
    <div class="modal-card modal-lg">
      <div class="modal-header">
        <div class="company-brand-header">
          <div id="detailAvatar" class="company-avatar-lg"></div>
          <div>
            <h3 id="detailRole">Job Title</h3>
            <p id="detailCompany" class="job-company-sub"></p>
          </div>
        </div>
        <button type="button" class="close-modal" aria-label="Close modal" onclick="closeDetailModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="detailMetrics" class="detail-metrics-grid"></div>
        <div class="detail-section">
          <h4>About the Role</h4>
          <div id="detailDescription" class="detail-description-body"></div>
        </div>
      </div>
      <div class="modal-footer" id="detailFooter"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
